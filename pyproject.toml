[project]
name = "receipts"
version = "0.1.0"
description = "An on-call agent whose memory is scoped, correctable, expiring - and provably load-bearing."
requires-python = ">=3.11"
dependencies = [
  "pymongo>=4.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["receipts"]
